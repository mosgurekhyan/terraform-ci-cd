name: terraform

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      TF_VAR_aws_region: eu-central-1

    steps:
      - uses: actions/checkout@v4

      - name: Show layout
        run: |
          pwd
          ls -la
          find . -name "*.tf" -not -path "./.terraform/*"

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
