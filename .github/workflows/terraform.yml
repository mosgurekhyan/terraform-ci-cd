name: Terraform CI/CD (zero-downtime)

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "eu-central-1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  
  # AWS Credentials
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  
  # INJECT THE SSH PUBLIC KEY HERE
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Show repo layout
        run: |
          pwd
          ls -la
          find . -name "*.tf" -not -path "./.terraform/*"

      - name: Terraform Format
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_app_version: ${{ github.sha }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_app_version: ${{ github.sha }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show outputs (URL)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "### 🚀 Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL:** $(terraform output -raw app_url)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY